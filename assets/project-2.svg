<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="itemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#p2Grad)"/>
  
  <!-- Browser Chrome Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#1e293b" />
  <rect x="0" y="24" width="600" height="18" fill="#1e293b" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="110" y="11" width="380" height="20" rx="6" fill="#0f172a" />
  <text x="300" y="25" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">https://luxe-store.vercel.app</text>

  <!-- Hero Banner -->
  <rect x="30" y="65" width="540" height="120" rx="12" fill="url(#itemGrad)"/>
  <text x="60" y="115" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="24">SUMMER COLLECTION 2026</text>
  <text x="60" y="140" fill="#fdf2f8" font-family="sans-serif" font-size="13">Diskon spesial hingga 40% untuk produk terpilih</text>
  <rect x="60" y="152" width="105" height="24" rx="12" fill="#ffffff"/>
  <text x="112" y="168" fill="#be185d" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Belanja Sekarang</text>

  <!-- Product Grid -->
  <g transform="translate(30, 205)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="125" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="12" width="95" height="65" rx="6" fill="#334155"/>
    <rect x="15" y="86" width="75" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="15" y="100" width="45" height="8" rx="4" fill="#ec4899"/>
    
    <!-- Card 2 -->
    <rect x="138" y="0" width="125" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="153" y="12" width="95" height="65" rx="6" fill="#334155"/>
    <rect x="153" y="86" width="75" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="153" y="100" width="45" height="8" rx="4" fill="#ec4899"/>

    <!-- Card 3 -->
    <rect x="276" y="0" width="125" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="291" y="12" width="95" height="65" rx="6" fill="#334155"/>
    <rect x="291" y="86" width="75" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="291" y="100" width="45" height="8" rx="4" fill="#ec4899"/>

    <!-- Card 4 -->
    <rect x="414" y="0" width="125" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="429" y="12" width="95" height="65" rx="6" fill="#334155"/>
    <rect x="429" y="86" width="75" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="429" y="100" width="45" height="8" rx="4" fill="#ec4899"/>
  </g>
</svg>
