<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b" />
      <stop offset="100%" stop-color="#2d124d" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="donut1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#p4Grad)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#241142" />
  <rect x="0" y="24" width="600" height="18" fill="#241142" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="110" y="11" width="380" height="20" rx="6" fill="#150a26" />
  <text x="300" y="25" fill="#d8b4fe" font-family="monospace" font-size="11" text-anchor="middle">https://fin-visualizer.vercel.app</text>

  <!-- Left Donut Chart Card -->
  <rect x="35" y="65" width="220" height="265" rx="12" fill="#23103d" stroke="#3b1d64" stroke-width="1.5"/>
  <text x="55" y="95" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">Distribusi Pengeluaran</text>
  <circle cx="145" cy="180" r="60" fill="none" stroke="#3b1d64" stroke-width="24"/>
  <circle cx="145" cy="180" r="60" fill="none" stroke="#a855f7" stroke-width="24" stroke-dasharray="160 380" stroke-linecap="round"/>
  <circle cx="145" cy="180" r="60" fill="none" stroke="#ec4899" stroke-width="24" stroke-dasharray="100 380" stroke-dashoffset="-170" stroke-linecap="round"/>
  <circle cx="145" cy="180" r="60" fill="none" stroke="#06b6d4" stroke-width="24" stroke-dasharray="80 380" stroke-dashoffset="-280" stroke-linecap="round"/>
  <text x="145" y="186" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">78%</text>
  <text x="145" y="275" fill="#c084fc" font-family="sans-serif" font-size="12" text-anchor="middle">Target Tercapai</text>

  <!-- Right Bar Charts Card -->
  <rect x="275" y="65" width="290" height="265" rx="12" fill="#23103d" stroke="#3b1d64" stroke-width="1.5"/>
  <text x="295" y="95" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">Statistik Performa Bulanan</text>

  <!-- Bars -->
  <g transform="translate(300, 120)">
    <rect x="15" y="70" width="28" height="100" rx="6" fill="url(#bar1)"/>
    <rect x="65" y="40" width="28" height="130" rx="6" fill="url(#bar1)"/>
    <rect x="115" y="90" width="28" height="80" rx="6" fill="url(#bar1)"/>
    <rect x="165" y="20" width="28" height="150" rx="6" fill="url(#bar1)"/>
    <rect x="215" y="50" width="28" height="120" rx="6" fill="#38bdf8"/>

    <!-- Labels -->
    <text x="29" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Jan</text>
    <text x="79" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Feb</text>
    <text x="129" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Mar</text>
    <text x="179" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Apr</text>
    <text x="229" y="185" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">Mei</text>
  </g>
</svg>
