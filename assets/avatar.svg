<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Circle with Glow -->
  <rect width="400" height="400" rx="200" fill="url(#bgGlow)" />
  
  <!-- Subtle decorative rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 6" />
  
  <!-- Outer Hijab Back -->
  <ellipse cx="200" cy="210" rx="95" ry="120" fill="url(#hijabGrad)" filter="url(#shadow)" />

  <!-- Clothes / Blazer -->
  <path d="M 110 370 Q 130 290 200 280 Q 270 290 290 370 C 295 390 105 390 110 370 Z" fill="url(#clothGrad)" />
  <!-- Inner shirt collar -->
  <path d="M 175 285 L 200 325 L 225 285 Z" fill="#6366f1" opacity="0.9" />

  <!-- Neck -->
  <rect x="185" y="230" width="30" height="45" rx="10" fill="url(#skinGrad)" />

  <!-- Face / Oval -->
  <ellipse cx="200" cy="195" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Hijab wrap framing face -->
  <path d="M 145 195 C 145 125 170 120 200 120 C 230 120 255 125 255 195 C 255 235 240 260 200 262 C 160 260 145 235 145 195 Z" 
        fill="none" stroke="url(#hijabGrad)" stroke-width="22" stroke-linecap="round" />
  <!-- Hijab draped shoulders -->
  <path d="M 130 260 C 130 240 160 260 200 260 C 240 260 270 240 270 260 C 270 295 240 320 200 320 C 160 320 130 295 130 260 Z" fill="url(#hijabGrad)" />

  <!-- Eyebrows -->
  <path d="M 172 175 Q 183 171 192 176" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />
  <path d="M 208 176 Q 217 171 228 175" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="182" cy="188" rx="5.5" ry="6" fill="#1e293b" />
  <circle cx="180" cy="186" r="2" fill="#ffffff" />
  <ellipse cx="218" cy="188" rx="5.5" ry="6" fill="#1e293b" />
  <circle cx="216" cy="186" r="2" fill="#ffffff" />

  <!-- Glasses (Stylish Modern Wireframe) -->
  <rect x="168" y="177" width="28" height="22" rx="7" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="204" y="177" width="28" height="22" rx="7" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 196 186 L 204 186" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 168 186 L 156 183" stroke="#38bdf8" stroke-width="2" />
  <path d="M 232 186 L 244 183" stroke="#38bdf8" stroke-width="2" />

  <!-- Smile & Cheek blush -->
  <ellipse cx="168" cy="203" rx="8" ry="4" fill="#f43f5e" opacity="0.25" />
  <ellipse cx="232" cy="203" rx="8" ry="4" fill="#f43f5e" opacity="0.25" />
  <path d="M 190 208 Q 200 216 210 208" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />

  <!-- Floating Tech Sparkles -->
  <g fill="#38bdf8" opacity="0.9">
    <path d="M 75 140 L 80 150 L 90 155 L 80 160 L 75 170 L 70 160 L 60 155 L 70 150 Z" />
    <circle cx="320" cy="110" r="4" fill="#f43f5e" />
    <path d="M 320 240 L 324 248 L 332 252 L 324 256 L 320 264 L 316 256 L 308 252 L 316 248 Z" fill="#fbbf24" />
  </g>
</svg>
